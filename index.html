<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XBorder RPA Pro · 跨境电商数据中台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="loginScreen">
  <div class="login-wrap">
    <div class="login-bg"></div>
    <div class="login-card">
      <div class="login-logo">XBorder RPA Pro</div>
      <div class="login-title">跨境电商数据中台</div>
      <div class="login-sub">🇲🇾 马来西亚 · 🇮🇩 印尼 · Shopee · Lazada · TikTok</div>
      <div class="field">
        <label>账号</label>
        <input type="text" id="loginUser" placeholder="输入账号" value="boss@xborder.com">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="loginPass" placeholder="输入密码" value="123456">
      </div>
      <div id="loginErr" style="color:#ef4444;font-size:12px;margin-bottom:8px;display:none;">账号或密码错误</div>
      <button class="btn-login" onclick="doLogin()">登 录</button>
      <div class="login-hint">
        <div class="login-hint-title">演示账号（点击快速填入）</div>
        <button class="user-chip" onclick="fillUser('boss@xborder.com','123456')">👔 老板</button>
        <button class="user-chip" onclick="fillUser('finance@xborder.com','123456')">💼 财务主管</button>
        <button class="user-chip" onclick="fillUser('data@xborder.com','123456')">📊 数据专员</button>
        <button class="user-chip" onclick="fillUser('ops_shopee_my@xborder.com','123456')">🛍 运营-Shopee MY</button>
        <button class="user-chip" onclick="fillUser('ops_lazada_id@xborder.com','123456')">🛒 运营-Lazada ID</button>
        <button class="user-chip" onclick="fillUser('ops_tiktok@xborder.com','123456')">🎵 运营-TikTok</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════ MAIN APP ═══════════ -->
<div id="mainApp" class="app" style="display:none;">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">XBorder RPA</div>
      <div class="logo-sub">跨境电商数据中台</div>
    </div>
    <div class="sidebar-user">
      <div class="user-name" id="sideUserName"></div>
      <div class="user-role" id="sideUserRole"></div>
      <div class="user-shops" id="sideUserShops"></div>
    </div>
    <div class="nav-area" id="navArea"></div>
    <div class="sidebar-bottom">
      <button class="nav-btn" onclick="doLogout()" style="color:var(--red);">
        <span>⬅</span><span>退出登录</span>
      </button>
    </div>
  </div>

  <!-- Main -->
  <div class="main-area">
    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-title" id="topbarTitle">经营总览</div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <select class="month-select" id="monthSelect" onchange="onMonthChange()">
          <option value="all">全部月份</option>
          <option value="2025-01">2025年1月</option>
          <option value="2025-02">2025年2月</option>
          <option value="2025-03">2025年3月</option>
          <option value="2025-04">2025年4月</option>
          <option value="2025-05">2025年5月</option>
          <option value="2025-06" selected>2025年6月</option>
        </select>
        <select class="shop-filter" id="shopFilter" onchange="onShopFilter()">
          <option value="all">全部店铺</option>
        </select>
        <button class="btn-upload" id="uploadBtn" onclick="openUpload()" style="display:none;">⬆ 上传报表</button>
        <span class="topbar-meta" id="topbarUser"></span>
      </div>
    </div>
    <!-- Content -->
    <div class="content" id="mainContent"></div>
  </div>
</div>

<!-- ═══════════ UPLOAD MODAL ═══════════ -->
<div id="uploadModal" class="modal-bg" style="display:none;" onclick="if(event.target===this)closeUpload()">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
      <div class="modal-title">上传报表</div>
      <button onclick="closeUpload()" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;">×</button>
    </div>
    <div class="modal-sub">选择报表类型和来源平台，支持 CSV / Excel 文件</div>

    <div style="font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600;">① 报表类型</div>
    <div class="type-grid">
      <button class="type-btn sel" onclick="selType(this,'order')" data-type="order">
        <div class="t-icon">📋</div><div class="t-name">订单报表</div><div class="t-desc">订单明细、销量统计</div>
      </button>
      <button class="type-btn" onclick="selType(this,'finance')" data-type="finance">
        <div class="t-icon">💰</div><div class="t-name">财务报表</div><div class="t-desc">收款结算、佣金明细</div>
      </button>
      <button class="type-btn" onclick="selType(this,'inventory')" data-type="inventory">
        <div class="t-icon">📦</div><div class="t-name">库存报表</div><div class="t-desc">在库数量、周转数据</div>
      </button>
      <button class="type-btn" onclick="selType(this,'ads')" data-type="ads">
        <div class="t-icon">📣</div><div class="t-name">广告报表</div><div class="t-desc">花费、ROAS、点击</div>
      </button>
    </div>

    <div style="font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600;">② 来源平台</div>
    <div class="plat-row" id="platBtns"></div>

    <div style="font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600;">③ 数据月份</div>
    <div class="month-row">
      <select id="upYear">
        <option value="2025">2025年</option>
        <option value="2024">2024年</option>
      </select>
      <select id="upMonth">
        <option value="01">1月</option><option value="02">2月</option>
        <option value="03">3月</option><option value="04">4月</option>
        <option value="05">5月</option><option value="06" selected>6月</option>
        <option value="07">7月</option><option value="08">8月</option>
        <option value="09">9月</option><option value="10">10月</option>
        <option value="11">11月</option><option value="12">12月</option>
      </select>
    </div>

    <div style="font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600;">④ 上传文件</div>
    <div class="dropzone" onclick="document.getElementById('fileInput').click()"
      ondragover="event.preventDefault();this.style.borderColor='var(--blue)'"
      ondragleave="this.style.borderColor='var(--border)'"
      ondrop="event.preventDefault();this.style.borderColor='var(--border)';handleDrop(event)">
      <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" multiple style="display:none" onchange="handleFiles(this.files)">
      <div style="font-size:32px;margin-bottom:8px;opacity:0.4;">⬆</div>
      <div style="font-weight:600;color:var(--ink);margin-bottom:4px;">拖拽文件到此处 / 点击选择</div>
      <div style="font-size:12px;color:var(--muted);">支持 .csv · .xlsx · 可同时选多个文件</div>
    </div>

    <div id="fileListArea" class="file-list"></div>

    <div id="uploadProgress" style="display:none;text-align:center;padding:16px;color:var(--muted);font-size:13px;">
      <span class="spin">⟳</span> 正在解析文件…
    </div>
    <div id="uploadResult" style="display:none;"></div>

    <div style="display:flex;gap:10px;margin-top:4px;">
      <button class="btn-secondary" onclick="closeUpload()">取消</button>
      <button class="btn-primary" id="doUploadBtn" onclick="doUpload()" style="flex:1;">确认上传</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
